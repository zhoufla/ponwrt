# PCDN 场景 conntrack 调优 —— 与爱快"内核设置"模板完全一致 (2026-11-28)
# 爱快默认: SynSent 5 / SynRecv 5 / Established 1800 / FinWait 10 / CloseWait 10
#           LastAck 10 / TimeWait 10 / Close 5 / UDP 10 / UDP Stream 60
# 唯一例外: TCP BBR 不抄——光猫内核无 bbr 模块且拥塞控制不影响转发流量
#
# 本文件随 airoha target 的 base-files 安装，只影响 AN7583 构建。
# OpenWRT-CI 仓库里另有一份 Files/etc/sysctl.d/99-pcdn-conntrack-qca.conf
# 服务 qualcommax 机型（RE-SS-01 实测口径 UDP 30/60），两份目标不同、互不覆盖。
# 文件名必须以 99 开头，保证在 11-nf-conntrack.conf（内含 60/180）之后生效。

# ---- 超时 ----
net.netfilter.nf_conntrack_tcp_timeout_syn_sent=5
net.netfilter.nf_conntrack_tcp_timeout_syn_recv=5
net.netfilter.nf_conntrack_tcp_timeout_established=1800
net.netfilter.nf_conntrack_tcp_timeout_fin_wait=10
net.netfilter.nf_conntrack_tcp_timeout_close_wait=10
net.netfilter.nf_conntrack_tcp_timeout_last_ack=10
net.netfilter.nf_conntrack_tcp_timeout_time_wait=10
net.netfilter.nf_conntrack_tcp_timeout_close=5
net.netfilter.nf_conntrack_udp_timeout=10
net.netfilter.nf_conntrack_udp_timeout_stream=60

# ---- 容量 ----
# PCDN 单机会开出上万条 UDP 流。实测（2026-11-28，开机 60 分钟）稳态
# 21,730 条、其中 UDP 占 96.7%，dmesg 无 "table full"，65,536 留有约 3 倍
# 余量；满表时 conntrack 内存约 32 MB，占 439 MB 可用内存的 7%。
# buckets 维持内核默认比例（max/4），实测平均链长 1.3，无需再放大。
net.netfilter.nf_conntrack_max=65536
net.netfilter.nf_conntrack_buckets=16384

# ---- 收包队列 ----
# 双核设备 packet_steering 把 pon0/eth0 全部 RX 队列压到 CPU1(rps_cpus=2)，
# 默认 backlog 1000 在 PCDN 突发下会大量丢包并连带丢掉 PPPoE 保活报文，
# 实测开机 80 分钟 CPU1 队列溢出丢弃已超 1000 万包。
net.core.netdev_max_backlog=8192
